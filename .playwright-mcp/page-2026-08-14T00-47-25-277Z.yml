              - text: o configurar la
              - link "renovación automática" [ref=f41e987]:
                - /url: https://www.godaddy.com/es/help/turn-on-auto-renew-20007
              - text: ", lo que te ayuda a asegurarte de que el nombre de tu sitio web siga registrado a tu nombre."
        - group [ref=f41e988] [cursor=pointer]:
