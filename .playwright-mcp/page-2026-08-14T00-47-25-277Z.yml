              - text: ) tienen plazos de registro más cortos.
            - paragraph [ref=f41e985]:
              - text: Si quieres ampliar tu registro del dominio, renovar tu dominio con GoDaddy es muy fácil. Puedes elegir entre
              - link "renovar manualmente" [ref=f41e986]:
