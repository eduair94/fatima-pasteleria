        - group [ref=f41e949] [cursor=pointer]:
          - heading "¿Qué es el registro de nombres de dominios?" [level=3] [ref=f41e951]
          - paragraph [ref=f41e956]:
            - text: El registro de nombre de dominio es el proceso de buscar una dirección web (como GoDaddy.com o LilysBikes.com) y, a continuación, inscribirse para poder usarla. Técnicamente no eres el propietario del dominio, pero una vez que lo registraste será tuyo por el tiempo que quieras mientras sigas pagando la tarifa de registro anual. Si dejas que se venza el registro del dominio, el dominio pasará a estar disponible para que otros lo registren. Para evitar que se te caduque la suscripción sin querer, GoDaddy ofrece una opción de renovación automática para todos los clientes. Para una capa adicional de protección, nuestra
