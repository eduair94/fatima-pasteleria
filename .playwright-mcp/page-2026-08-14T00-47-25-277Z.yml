              - listitem [ref=f41e1047]:
                - strong [ref=f41e1048]: "Un servicio de atención al cliente galardonado:"
                - text: en GoDaddy queremos asegurarnos de que tengas éxito en línea, y nuestros expertos en atención al cliente, siempre amables y eficaces, están aquí para ayudarte a conseguirlo. Aunque todavía no seas cliente, estaremos encantados de charlar contigo y ayudarte a encontrar la información que buscas.
        - group [ref=f41e1049] [cursor=pointer]:
          - heading "¿Debo comprar la Protección de dominios para mi nombre de dominio?" [level=3] [ref=f41e1051]
          - generic [ref=f41e1055]:
            - paragraph [ref=f41e1056]: Para proteger mejor tu dominio (y tu marca en Internet), GoDaddy ofrece planes de protección de dominios que protegen tu dominio frente a riesgos en línea y acciones no autorizadas. Con un plan de Protección de dominios, recibirás notificaciones cuando se realicen cambios importantes en tu dominio y podrás verificar si las solicitudes, como una transferencia de dominios, es válida o no. Con los planes de protección de dominios de GoDaddy, tendrás la tranquilidad de saber que tu presencia en línea está protegida, para que puedas centrarte en desarrollar y hacer crecer tu negocio.
            - paragraph [ref=f41e1057]:
              - link "Echa un vistazo a los planes de protección de dominios de GoDaddy." [ref=f41e1058]:
                - /url: https://www.godaddy.com/es/domains/domain-protection
        - group [ref=f41e1059] [cursor=pointer]:
          - heading "¿Qué se incluye gratis con mi dominio?" [level=3] [ref=f41e1061]
          - list [ref=f41e1066]:
            - listitem [ref=f41e1067]:
              - strong [ref=f41e1068]: "Seguridad DMARC automática y gratuita:"
              - text: con DMARC activado, los proveedores de correo electrónico como Gmail y Yahoo reciben automáticamente la orden de bloquear o poner en cuarentena cualquier correo electrónico que no supere tus controles de seguridad, lo que significa que los correos de los estafadores nunca llegan a la bandeja de entrada del destinatario.
            - listitem [ref=f41e1069]:
              - strong [ref=f41e1070]: "Certificado SSL gratuito con el plan de Hosting:"
              - text: se incluye un certificado SSL de GoDaddy de forma gratuita durante toda la vigencia de tu plan de Hosting. Nuestros certificados no tienen complicaciones y se instalan, validan y renuevan automáticamente.
            - listitem [ref=f41e1071]:
              - strong [ref=f41e1072]: "Redireccionamiento gratuito de URL de dominio:"
              - text: nuestras herramientas, muy fáciles de usar, te permiten redirigir tu dominio a un sitio web ya existente.
            - listitem [ref=f41e1073]:
