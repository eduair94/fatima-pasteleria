                - link "Crea un correo electrónico profesional" [ref=f41e930]:
                  - /url: https://www.godaddy.com/es/email/correo-empresarial
                - text: con tu nombre de dominio
            - paragraph [ref=f41e931]:
              - text: Como registrador líder a nivel mundial, GoDaddy puede ayudarte a encontrar el nombre de dominio que mejor se adapte a tus necesidades. Puedes usar nuestra herramienta de búsqueda en la parte superior de la página para comprobar la disponibilidad de un nombre de dominio o usar
              - link "GoDaddy Airo" [ref=f41e932]:
