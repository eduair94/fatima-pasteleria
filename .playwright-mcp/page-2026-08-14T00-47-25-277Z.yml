      - heading "Preguntas frecuentes sobre dominios" [level=2] [ref=f41e913]
      - generic [ref=f41e915]:
        - group [ref=f41e916] [cursor=pointer]:
          - heading "¿Qué es un nombre de dominio y por qué necesito uno?" [level=3] [ref=f41e918]
          - generic [ref=f41e922]:
            - paragraph [ref=f41e923]: Un nombre de dominio es lo que las personas escriben en sus navegadores para encontrar un sitio web. Es parecido a como se utiliza la dirección de una calle para encontrar un edificio. Todos los sitios web, servidores o dispositivos digitales que estén conectados a Internet tienen una dirección IP asignada que puedes usar para verlos o visitarlos. Esta dirección IP es una larga cadena de números y letras que sería muy difícil de memorizar, por lo que un nombre de dominio es, simplemente, una versión fácil de recordar de esa dirección IP.
            - paragraph [ref=f41e924]: Cuando escribes un nombre de dominio (como www.godaddy.com o www.google.com) en tu navegador, el sistema de nombre de dominio, o DNS, toma ese dominio y lo traduce a su dirección IP, lo que le permite encontrar el sitio web asociado.
            - paragraph [ref=f41e925]: "Tener tu propio nombre de dominio puede ayudar a que las personas que te buscan a ti o a tu marca en línea te vean como una empresa más legítima. Con un nombre de dominio podrás:"
            - list [ref=f41e926]:
              - listitem [ref=f41e927]:
                - link "Crea un sitio web" [ref=f41e928]:
                  - /url: https://www.godaddy.com/es/paginas-web/creador-de-paginas-web
                - text: para tu escaparate o tu negocio de comercio electrónico
