              - text: para poner en marcha tu idea en línea. No importa en qué fase del proceso te encuentres, podemos ayudarte a crecer y a desarrollar tu presencia en línea. Desde
              - link "servicios de web hosting" [ref=f41e933]:
                - /url: https://www.godaddy.com/es/hosting/web-hosting
              - text: (que incluyen certificados SSL gratuitos) hasta un
              - link "Generador de logos" [ref=f41e934]:
                - /url: https://www.godaddy.com/es/crear-logo
              - text: que te ayudará a definir tu marca, y una
              - link "Suite de marketing digital" [ref=f41e935]:
                - /url: https://www.godaddy.com/es/marketing-digital/marketing-digital
              - text: que te facilita la gestión de tus redes sociales, el SEO y mucho más. Además, para todos nuestros productos y servicios, cuentas con la ayuda de nuestro increíble (y galardonado) equipo de asistencia técnica.
        - group [ref=f41e936] [cursor=pointer]:
          - heading "¿Cómo saber si un dominio está disponible?" [level=3] [ref=f41e938]
          - generic [ref=f41e942]:
            - paragraph [ref=f41e943]: Para comprobar si un nombre de dominio está disponible, solo tienes que escribirlo en la barra de búsqueda de GoDaddy y te diremos al instante si está libre o si ya lo tiene otra persona.
