              - text: La duración del registro del dominio puede variar según la extensión de dominio que compres. Para la mayoría de las extensiones, los registradores de nombres de dominio permiten que los clientes registren dominios por hasta 10 años a la vez. Normalmente, los clientes registran dominios por entre uno y tres años. Algunos dominios premium y gTLD (como
              - link ".au" [ref=f41e983]:
