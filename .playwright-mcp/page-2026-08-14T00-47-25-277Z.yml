              - text: o cualquier plan anual
              - link "Hosting administrado para WordPress" [ref=f41e997]:
                - /url: https://www.godaddy.com/es/hosting/wordpress-hosting
              - text: de GoDaddy y obtendrás automáticamente un
              - link "dominio gratis" [ref=f41e998]:
                - /url: https://www.godaddy.com/es/domains/free-domain
              - text: .
            - paragraph [ref=f41e999]: Una vez que hagas clic en Agregar al carrito para un plan de hosting o de WordPress, se te dará la opción de seleccionar plazos mensuales o anuales. Asegúrate de elegir un plazo anual si quieres obtener el dominio gratis.
            - paragraph [ref=f41e1000]: Haz clic en Continuar con estas opciones en la parte inferior de la página para pasar al siguiente paso. Aquí verás una barra de búsqueda para buscar el nombre de dominio que deseas.
            - paragraph [ref=f41e1001]: Una vez que hayas encontrado el nombre que deseas, solo tienes que agregar el dominio a tu carrito y continuar con el pago.
        - group [ref=f41e1002] [cursor=pointer]:
          - heading "¿Cómo elegir un registrador de dominios?" [level=3] [ref=f41e1004]
          - generic [ref=f41e1008]:
            - paragraph [ref=f41e1009]: "Cuando debas decidir si quieres registrar un dominio, ten en cuenta los siguientes puntos:"
            - list [ref=f41e1010]:
              - listitem [ref=f41e1011]:
                - strong [ref=f41e1012]: "Precios:"
                - text: presta atención tanto al precio inicial como al de la renovación.
              - listitem [ref=f41e1013]:
                - strong [ref=f41e1014]: "Privacidad:"
                - text: busca un registrador que incluya la protección de la privacidad en el registro del dominio y que no la ofrezca como un servicio adicional de pago.
              - listitem [ref=f41e1015]:
                - strong [ref=f41e1016]: "Atención al cliente:"
                - text: fíjate en qué canales de comunicación ofrecen (teléfono, SMS, chat, correo electrónico) y si están disponibles las 24 horas del día, los 7 días de la semana, o solo en un horario concreto.
              - listitem [ref=f41e1017]:
                - strong [ref=f41e1018]: "Extensiones de dominio disponibles:"
                - text: si quieres algo más que un .com, .org o .net, fíjate en cuántos dominios de primer nivel ofrece el registrador.
              - listitem [ref=f41e1019]:
                - strong [ref=f41e1020]: "Servicios adicionales:"
                - text: si quieres crear tu presencia en línea, comprueba si el registrador ofrece otros servicios, como una tienda online o un creador de páginas web, Hosting, certificados SSL, etc.
              - listitem [ref=f41e1021]:
                - strong [ref=f41e1022]: "Reputación:"
                - text: la trayectoria de una empresa habla por sí sola. Echa un vistazo a las opiniones de los clientes y a las valoraciones de Trustpilot. Además, asegúrate de que la empresa esté acreditada por la ICANN.
            - paragraph [ref=f41e1023]: Si lo piensas bien, verás que hay una razón por la que GoDaddy es el registrador de dominios preferido por millones de personas en todo el mundo.
        - group [ref=f41e1024] [cursor=pointer]:
          - heading "¿Por qué debería comprar un nombre de dominio en GoDaddy?" [level=3] [ref=f41e1026]
          - generic [ref=f41e1030]:
            - paragraph [ref=f41e1031]: "GoDaddy es el líder mundial en dominios, y contamos con la confianza de más de Más de 20 millones de clientes en todo el mundo. Pero nos destacamos como una excelente opción para la compra de tu dominio por varios motivos:"
