          - generic [ref=f130e340]:
            - generic [ref=f130e341]: Pricing Comparison
            - generic [ref=f130e342]: Unfortunately, most registrars make it very difficult to determine exactly what their fees are. Our competitors frequently advertise one price, but by the time you tack on their fees and follow the trail of asterisks and fine print, you end up nickel-and-dimed into a higher price. It's also common for our competitors to advertise low prices to get you in the door, but then hit you with hidden setup fees, mandatory minimums or force you to purchase expensive additional services just to get the originally marketed price. In other cases you have to wait to place your order until a special promotion or coupon code is given in order to receive advertised pricing.
          - generic [ref=f130e343]:
            - generic [ref=f130e344]: The NameSilo Difference
            - generic [ref=f130e345]: At NameSilo, we take pride in making it easy and hassle-free for you to get the lowest domain registration prices on the Internet without any of those tricks. No exceptions.
